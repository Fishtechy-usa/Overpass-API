name: Build and deploy Overpass API (dev)

# Build -> push to ECR -> pull and redeploy the container on EC2.
# Both jobs run on the self-hosted runner, which is the EC2 server itself.
#
# Required secrets (Settings -> Environments -> dev -> Secrets):
#   AWS_REGION              e.g. us-east-2
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   ECR_REPOSITORY          e.g. overpass-api-dev
#   CONTAINER_NAME          e.g. overpass-api
#   SLACK_WEBHOOK_URL

on:
  push:
    branches: [ "master" ]
    paths:
      - "src/**"
      - "docker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  build-and-push-image-dev:
    if: github.repository == 'Fishtechy-usa/Overpass-API'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve build variables
        id: resolve-build
        run: |
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" | tee -a "$GITHUB_OUTPUT" "$GITHUB_ENV"
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" | tee -a "$GITHUB_OUTPUT" "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.resolve-build.outputs.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f docker/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy-dev:
    if: github.repository == 'Fishtechy-usa/Overpass-API'
    needs: build-and-push-image-dev
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve deploy variables
        id: resolve-deploy
        run: |
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" | tee -a "$GITHUB_OUTPUT" "$GITHUB_ENV"
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" | tee -a "$GITHUB_OUTPUT" "$GITHUB_ENV"
          echo "CONTAINER_NAME=${{ secrets.CONTAINER_NAME }}" | tee -a "$GITHUB_OUTPUT" "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.resolve-deploy.outputs.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Resolve image from CI commit
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ steps.image.outputs.image_tag }}" \
            --region "$AWS_REGION" >/dev/null

      - name: Pull image from Amazon ECR
        run: docker pull "${{ steps.image.outputs.image }}"

      - name: Deploy container on EC2
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          # The overpass-db volume is NOT touched — the imported database survives.
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 80:80 \
            -e OVERPASS_DIFF_UPDATES=0 \
            -v overpass-db:/db \
            -v /opt/overpass-api/data:/data:ro \
            "$IMAGE"

      - name: Wait for the API to become healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/status >/dev/null 2>&1; then
              echo "API is responding."
              curl -s http://localhost/api/status
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, waiting..."
            sleep 10
          done

          echo "API did not respond within 5 minutes. Container logs:"
          docker logs --tail 50 "$CONTAINER_NAME"
          exit 1

      - name: Smoke-test the data
        run: |
          set -euo pipefail
          echo "--- Rivers near Kathmandu ---"
          curl -s -X POST http://localhost/api/interpreter \
            --data-urlencode 'data=[out:json][timeout:60];way["waterway"="river"](27.65,85.25,27.78,85.40);out count;'
          echo
          echo "--- Rivers in the Mississippi delta ---"
          curl -s -X POST http://localhost/api/interpreter \
            --data-urlencode 'data=[out:json][timeout:60];way["waterway"="river"](29.0,-91.0,31.0,-89.0);out count;'

      - name: Remove old docker images
        run: docker image prune -f

      - name: Slack Notification on SUCCESS
        if: success()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: A develop CD job has succeeded for *overpass-api-dev*.
          attachments: |
            [
              {
                "color": "good",
                "author_name": "${{ github.actor }}",
                "author_icon": "${{ github.event.sender.avatar_url }}",
                "fields": [
                  {
                    "title": "Commit Message",
                    "value": "${{ github.event.head_commit.message || 'Manual deployment' }}"
                  },
                  {
                    "title": "Run URL",
                    "value": "${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
                  },
                  {
                    "title": "Branch / SHA",
                    "value": "${{ github.ref_name }} / ${{ steps.image.outputs.image_tag }}"
                  }
                ]
              }
            ]

      - name: Slack Notification on FAILURE
        if: failure()
        uses: tokorom/action-slack-incoming-webhook@main
        env:
          INCOMING_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          text: A develop CD job has failed for *overpass-api-dev*.
          attachments: |
            [
              {
                "color": "danger",
                "author_name": "${{ github.actor }}",
                "author_icon": "${{ github.event.sender.avatar_url }}",
                "fields": [
                  {
                    "title": "Commit Message",
                    "value": "${{ github.event.head_commit.message || 'Manual deployment' }}"
                  },
                  {
                    "title": "Run URL",
                    "value": "${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
                  },
                  {
                    "title": "Branch / SHA",
                    "value": "${{ github.ref_name }} / ${{ steps.image.outputs.image_tag }}"
                  }
                ]
              }
            ]