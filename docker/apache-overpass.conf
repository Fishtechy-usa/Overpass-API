# Apache vhost for the Overpass API CGI frontend.
# ScriptAlias exposes every binary in /usr/local/cgi-bin/ (interpreter,
# status, timestamp, xapi, map, ...) under /api/, matching the paths the
# public Overpass API and every OSM tool (Overpass Turbo, JOSM, etc.) expect.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # Overpass resolves its database directory from this environment
    # variable (must match OVERPASS_DB_DIR used by the dispatcher).
    SetEnv OVERPASS_DB_DIR /db/

    DocumentRoot /var/www/html

    ScriptAlias /api/ /usr/local/cgi-bin/
    <Directory "/usr/local/cgi-bin">
        Options +ExecCGI
        Require all granted
    </Directory>

    # Basic request logging, useful for spotting abusive/expensive queries.
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/overpass_error.log
    CustomLog ${APACHE_LOG_DIR}/overpass_access.log combined

    # Overpass queries can legitimately take minutes for large areas.
    TimeOut 600
</VirtualHost>
